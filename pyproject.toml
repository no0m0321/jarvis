[project]
name = "jarvis-voice"
version = "0.5.0"
description = "Voice-first personal AI assistant — Claude-powered, autonomous, holographic HUD (Korean/English wake word)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "swxvno" }]
keywords = ["ai", "assistant", "voice", "claude", "anthropic", "wake-word", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    # Cross-platform 코어 (mac/win 양쪽)
    "pyperclip>=1.9.0",       # 클립보드
    "mss>=10.0.0",            # 화면 캡처 (mac/win/linux)
    "Pillow>=10.0.0",         # 이미지 인코딩
    "opencv-python-headless>=4.10.0",  # 웹캠 (모든 OS)
    "pyttsx3>=2.98",          # 크로스플랫폼 TTS fallback (Windows SAPI 사용)
    "playsound>=1.3.0; python_version < '3.13'",  # 사운드 재생 (3.13+에서는 별 불안정)
    # Windows 전용
    "pywin32>=308; sys_platform == 'win32'",      # win32 API (Outlook/시스템)
    "win10toast>=0.9; sys_platform == 'win32'",   # 토스트 알림
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "commitizen>=3.20.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
openai = [
    "openai>=1.50.0",
]
memory = [
    "chromadb>=0.5.0",
]
all = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[project.urls]
Homepage = "https://github.com/no0m0321/jarvis"
Repository = "https://github.com/no0m0321/jarvis"
Issues = "https://github.com/no0m0321/jarvis/issues"
Documentation = "https://github.com/no0m0321/jarvis/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Conventional commits 기반 자동 버전 bump + CHANGELOG
# 사용:  cz bump          (auto: feat=minor, fix=patch, BREAKING=major)
#        cz bump --dry-run
#        cz changelog
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.5.0"
version_files = [
    "pyproject.toml:version",
    "src/jarvis/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
