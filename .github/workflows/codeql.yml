name: CodeQL

on:
  push:
    branches: [main, kim]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 03:00 UTC — 정기 보안 스캔
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended: 추가 보안 쿼리 (default는 security 카테고리만)
          queries: security-extended,security-and-quality

      # Python은 build 불필요 — autobuild skip
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
