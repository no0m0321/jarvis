# Dependabot 자동 업데이트 + 보안 알림
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ── Python (pyproject.toml) ──
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Node (docs/package.json — Vercel functions) ──
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      js-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Stripe / Supabase는 보안 업데이트만 자동
    ignore:
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions (workflow 자체) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
